name: Publish verified APK input
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag, exactly v followed by the APK versionName
        type: string
        required: true
      input_commit:
        description: Full 40-character commit SHA containing release-manifest.json and parts/
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: cutedog-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.verify.outputs.tag }}
      mode: ${{ steps.verify.outputs.mode }}
      apk: ${{ steps.verify.outputs.apk }}
      sourceCommit: ${{ steps.verify.outputs.sourceCommit }}
      inputCommit: ${{ steps.verify.outputs.inputCommit }}
      tagObject: ${{ steps.verify.outputs.tagObject }}
    steps:
      # Run verifier code from the workflow's own commit. The APK input commit is data only.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: 'build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Check offline release verifier boundaries
        run: python3 scripts/prepare-release-input.py self-test
      - name: Fetch immutable input and verify APK against the tag source
        id: verify
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          INPUT_COMMIT: ${{ inputs.input_commit }}
        run: |
          set -euo pipefail
          arguments=(fetch-verify --tag "$RELEASE_TAG"
            --output "$RUNNER_TEMP/verified-release"
            --build-tools "$ANDROID_HOME/build-tools/35.0.0"
            --github-output "$GITHUB_OUTPUT")
          if [ -n "$INPUT_COMMIT" ]; then arguments+=(--input-commit "$INPUT_COMMIT"); fi
          python3 scripts/prepare-release-input.py "${arguments[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: verified-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verified-release/
          if-no-files-found: error
          retention-days: 30
  publish:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: verified-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: verified-release
      - name: Create a new GitHub Release without replacing existing assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
          RELEASE_MODE: ${{ needs.verify.outputs.mode }}
          APK_FILE: ${{ needs.verify.outputs.apk }}
          TAG_OBJECT: ${{ needs.verify.outputs.tagObject }}
        run: |
          set -euo pipefail
          cd verified-release
          sha256sum --check SHA256SUMS.txt
          # Check again immediately before create; gh create also rejects an existing release.
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'This tag already has a Release. Refusing to replace it or any asset.' >&2
            exit 1
          fi
          remote_tag="$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')"
          test "$remote_tag" = "$TAG_OBJECT"
          flags=(--verify-tag --title "CuteDog $RELEASE_TAG" --notes-file BUILD-INFO.txt --latest=false)
          case "$RELEASE_MODE" in
            draft) flags+=(--draft) ;;
            prerelease) flags+=(--prerelease) ;;
            stable) ;;
            *) echo 'Invalid verified release mode' >&2; exit 1 ;;
          esac
          gh release create "$RELEASE_TAG" "${flags[@]}" "$APK_FILE" \
            SHA256SUMS.txt BUILD-INFO.json BUILD-INFO.txt RELEASE-INFO.json \
            signature-verification.txt apk-metadata.txt release-manifest.json
      - name: Download the uploaded APK and verify its actual bytes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
          APK_FILE: ${{ needs.verify.outputs.apk }}
        run: |
          set -euo pipefail
          cd verified-release
          download_dir="$(mktemp -d "$RUNNER_TEMP/cutedog-release-download.XXXXXX")"
          gh release download "$RELEASE_TAG" --pattern "$APK_FILE" --dir "$download_dir"
          python3 - "$download_dir/$APK_FILE" "$RUNNER_TEMP/release-download-verification.json" <<'PY'
          import datetime, hashlib, json, os, sys
          from pathlib import Path
          apk, output = map(Path, sys.argv[1:])
          expected = json.loads(Path('BUILD-INFO.json').read_text())
          release = json.loads(Path('RELEASE-INFO.json').read_text())
          digest = hashlib.sha256()
          with apk.open('rb') as stream:
              while chunk := stream.read(1024 * 1024):
                  digest.update(chunk)
          actual_size, actual_hash = apk.stat().st_size, digest.hexdigest()
          passed = (apk.name == expected['file'] and actual_size == expected['bytes']
                    and actual_hash == expected['sha256'] and release['tag'] == os.environ['RELEASE_TAG'])
          proof = {
              'schemaVersion': 1, 'verifiedAt': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'repository': os.environ['GH_REPO'], 'tag': release['tag'],
              'sourceCommit': release['sourceCommit'], 'inputCommit': release['inputCommit'],
              'tagObject': release['tagObject'], 'runId': os.environ['GITHUB_RUN_ID'],
              'runAttempt': os.environ['GITHUB_RUN_ATTEMPT'], 'method': 'gh release download',
              'file': apk.name, 'expectedBytes': expected['bytes'], 'actualBytes': actual_size,
              'expectedSha256': expected['sha256'], 'actualSha256': actual_hash,
              'status': 'passed' if passed else 'failed',
              'publicUrlVerification': 'not_run; separate unauthenticated public-URL download is required',
          }
          output.write_text(json.dumps(proof, ensure_ascii=False, indent=2) + '\n')
          if not passed:
              raise SystemExit('Uploaded Release APK does not match the verified input')
          print(f"Release download verified: {apk.name}, {actual_size} bytes, SHA-256 {actual_hash}")
          PY
          # This is a new evidence attachment, never a replacement of an existing asset.
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/release-download-verification.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-download-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-download-verification.json
          if-no-files-found: warn
          retention-days: 30
