name: Android verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install pinned SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Unit tests, lint, and APK
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Verify and package this build
        run: python3 scripts/package-apk.py
      - uses: actions/upload-artifact@v4
        with:
          name: CuteDog-debug-apk
          path: artifacts/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
  device-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 35]
    env:
      TEST_API_LEVEL: ${{ matrix.api-level }}
    steps:
      - uses: actions/checkout@v5
      - name: Initialize evidence even if emulator startup later fails
        run: scripts/run-device-tests.sh --initialize-only --output "$RUNNER_TEMP/instrumentation-evidence"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install pinned compilation SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Run current-source tests with granted and denied permissions
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none -accel on
          script: scripts/run-device-tests.sh --disposable --output "$RUNNER_TEMP/instrumentation-evidence"
      - name: Retain actual XML, selected logs, and counts even on failure
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instrumentation-evidence-api-${{ matrix.api-level }}
          path: ${{ runner.temp }}/instrumentation-evidence/
          if-no-files-found: error
          retention-days: 90
  retain-device-evidence:
    # PR code never receives repository write access. Artifact retention above still applies.
    if: ${{ always() && github.event_name != 'pull_request' }}
    needs: device-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 35]
    concurrency:
      group: cutedog-instrumentation-evidence-api-${{ matrix.api-level }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: instrumentation-evidence-api-${{ matrix.api-level }}
          path: ${{ runner.temp }}/retained-instrumentation
      - name: Append evidence to its dedicated API branch
        env:
          EVIDENCE_BRANCH: codex/instrumentation-evidence-api${{ matrix.api-level }}
          EVIDENCE_PATH: runs/${{ github.run_id }}-${{ github.run_attempt }}/api-${{ matrix.api-level }}
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/retained-instrumentation/summary.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git ls-remote --exit-code --heads origin "refs/heads/$EVIDENCE_BRANCH" >/dev/null; then
            git fetch origin "$EVIDENCE_BRANCH"
            git switch --detach FETCH_HEAD
            git switch -C "$EVIDENCE_BRANCH"
          else
            git switch --orphan "$EVIDENCE_BRANCH"
          fi
          test ! -e "$EVIDENCE_PATH"
          mkdir -p "$EVIDENCE_PATH"
          cp -R "$RUNNER_TEMP/retained-instrumentation/." "$EVIDENCE_PATH/"
          git add -- "$EVIDENCE_PATH"
          git commit -m "[skip ci] Record API ${{ matrix.api-level }} instrumentation evidence for run $GITHUB_RUN_ID"
          for attempt in 1 2 3; do
            if git push origin "HEAD:refs/heads/$EVIDENCE_BRANCH"; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            git fetch origin "$EVIDENCE_BRANCH"
            git rebase FETCH_HEAD
          done
