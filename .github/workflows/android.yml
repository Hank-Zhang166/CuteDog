name: Android verification
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'gradle.properties'
      - 'gradlew*'
      - '*.gradle.kts'
      - '.github/workflows/android.yml'
      - 'art/character/motions.json'
      - 'scripts/cloud-gradle.py'
      - 'scripts/setup-android.py'
      - 'scripts/package-apk.py'
      - 'scripts/run-device-*.sh'
      - 'scripts/profile-device.py'
      - 'scripts/tests/**'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Initialize build evidence
        run: |
          mkdir -p "$RUNNER_TEMP/build-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/build-evidence/source-commit.txt"
          git status --porcelain > "$RUNNER_TEMP/build-evidence/source-status.txt"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install pinned SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Verify device-host orchestration fixtures
        run: python3 -m unittest discover -s scripts/tests -p 'test_device_*.py' 2>&1 | tee "$RUNNER_TEMP/build-evidence/host-regression.log"
      - name: Unit tests, lint, and APK
        id: verify
        run: |
          mkdir -p "$RUNNER_TEMP/build-evidence"
          java -version > "$RUNNER_TEMP/build-evidence/java-version.txt" 2>&1
          free -m > "$RUNNER_TEMP/build-evidence/memory-before.txt"
          getconf _NPROCESSORS_ONLN > "$RUNNER_TEMP/build-evidence/cpu-count.txt"
          if [ -r /sys/fs/cgroup/memory.events ]; then cp /sys/fs/cgroup/memory.events "$RUNNER_TEMP/build-evidence/cgroup-memory-before.txt"; fi
          set +e
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug --console=plain --stacktrace 2>&1 | tee "$RUNNER_TEMP/build-evidence/gradle.log"
          pipeline_status=("${PIPESTATUS[@]}")
          set -e
          printf '%s\n' "${pipeline_status[0]}" > "$RUNNER_TEMP/build-evidence/gradle-exit-code.txt"
          printf '%s\n' "${pipeline_status[1]}" > "$RUNNER_TEMP/build-evidence/log-write-exit-code.txt"
          if [ "${pipeline_status[1]}" -ne 0 ]; then exit "${pipeline_status[1]}"; fi
          exit "${pipeline_status[0]}"
      - name: Verify and package this build
        id: package
        run: |
          set +e
          python3 scripts/package-apk.py 2>&1 | tee "$RUNNER_TEMP/build-evidence/packaging.log"
          pipeline_status=("${PIPESTATUS[@]}")
          set -e
          printf '%s\n' "${pipeline_status[0]}" > "$RUNNER_TEMP/build-evidence/packaging-exit-code.txt"
          if [ "${pipeline_status[1]}" -ne 0 ]; then exit "${pipeline_status[1]}"; fi
          exit "${pipeline_status[0]}"
      - uses: actions/upload-artifact@v4
        with:
          name: CuteDog-debug-apk
          path: artifacts/
          if-no-files-found: error
      - name: Collect current build reports even when verification fails
        if: always()
        env:
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          PACKAGE_OUTCOME: ${{ steps.package.outcome }}
        run: |
          mkdir -p "$RUNNER_TEMP/build-evidence"
          free -m > "$RUNNER_TEMP/build-evidence/memory-after.txt"
          if [ -r /sys/fs/cgroup/memory.events ]; then cp /sys/fs/cgroup/memory.events "$RUNNER_TEMP/build-evidence/cgroup-memory-after.txt"; fi
          python3 - "$RUNNER_TEMP/build-evidence" <<'PY'
          import datetime,hashlib,json,os,shutil,sys,xml.etree.ElementTree as ET
          from pathlib import Path
          output=Path(sys.argv[1]);output.mkdir(parents=True,exist_ok=True)
          unit=Path('app/build/test-results/testDebugUnitTest')
          if unit.is_dir(): shutil.copytree(unit,output/'unit-junit',dirs_exist_ok=True)
          for source in Path('app/build/reports').glob('lint-results-debug.*'):
              if source.is_file(): shutil.copy2(source,output/source.name)
          hashes=[]
          inputs=['app/src/main/AndroidManifest.xml','app/build.gradle.kts','build.gradle.kts','settings.gradle.kts','gradle.properties',
                  'gradle/wrapper/gradle-wrapper.properties','gradle/wrapper/gradle-wrapper.jar','app/src/main/assets/pet3d/manifest.json',
                  'app/src/test/resources/chat/localhost.p12']
          for name in inputs:
              source=Path(name)
              hashes.append({'path':name,'exists':source.is_file(),**({'bytes':source.stat().st_size,'sha256':hashlib.sha256(source.read_bytes()).hexdigest()} if source.is_file() else {})})
          manifests=set()
          for pattern in ('merged_manifests/debug/**/AndroidManifest.xml','merged_manifest/debug/**/AndroidManifest.xml','packaged_manifests/debug/**/AndroidManifest.xml'):
              manifests.update(Path('app/build/intermediates').glob(pattern))
          for source in sorted(manifests):
              target=output/'manifests'/source.relative_to('app/build/intermediates');target.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(source,target)
              hashes.append({'path':str(source),'exists':True,'bytes':source.stat().st_size,'sha256':hashlib.sha256(source.read_bytes()).hexdigest()})
          (output/'build-input-hashes.json').write_text(json.dumps(hashes,ensure_ascii=False,indent=2)+'\n')
          for name in ('BUILD-INFO.json','SHA256SUMS.txt','signature-verification.txt','apk-metadata.txt'):
              source=Path('artifacts')/name
              if source.is_file(): shutil.copy2(source,output/name)
          counts={key:0 for key in ('passed','failed','error','skipped','total')};cases=[];parse_errors=[]
          for report in sorted((output/'unit-junit').glob('TEST-*.xml')):
              try:
                  for item in ET.parse(report).getroot().iter('testcase'):
                      state='failed' if item.find('failure') is not None else 'error' if item.find('error') is not None else 'skipped' if item.find('skipped') is not None else 'passed'
                      counts[state]+=1;counts['total']+=1
                      reason=next((node for node in item if node.tag in ('failure','error','skipped')),None)
                      cases.append({'id':item.get('classname','')+'#'+item.get('name',''),'status':state,'report':str(report.relative_to(output)),
                                    'reason':((reason.get('message','')+' '+(reason.text or '')).strip()[:6000] if reason is not None else None)})
              except ET.ParseError as error: parse_errors.append(str(report.name)+': '+str(error))
          def recorded_integer(name):
              path=output/name
              return int(path.read_text().strip()) if path.is_file() else None
          source_commit=output/'source-commit.txt'
          summary={'sourceCommit':source_commit.read_text().strip() if source_commit.is_file() else os.environ.get('GITHUB_SHA'),'runId':os.environ.get('GITHUB_RUN_ID'),'runAttempt':os.environ.get('GITHUB_RUN_ATTEMPT'),
                   'verificationOutcome':os.environ.get('VERIFY_OUTCOME'),'packagingOutcome':os.environ.get('PACKAGE_OUTCOME'),
                   'gradleExitCode':recorded_integer('gradle-exit-code.txt'),'logWriteExitCode':recorded_integer('log-write-exit-code.txt'),'packagingExitCode':recorded_integer('packaging-exit-code.txt'),
                   'unitReportCounts':counts,'testCases':cases,'xmlParseErrors':parse_errors,'capturedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),
                   'unitReportsPresent':bool(list((output/'unit-junit').glob('TEST-*.xml'))),'lintReportsPresent':bool(list(output.glob('lint-results-debug.*'))),
                   'note':'Counts come from actual retained JUnit XML. Missing reports and skipped phases are not passing tests.'}
          (output/'summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: ${{ runner.temp }}/build-evidence/
          if-no-files-found: error
          retention-days: 90
  retain-build-evidence:
    if: ${{ always() && github.event_name != 'pull_request' }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    concurrency:
      group: cutedog-build-evidence
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: verification-reports
          path: ${{ runner.temp }}/retained-build
      - name: Append build evidence without changing application branches
        env:
          EVIDENCE_PATH: runs/${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/retained-build/summary.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git ls-remote --exit-code --heads origin refs/heads/codex/build-evidence >/dev/null; then
            git fetch origin codex/build-evidence
            git switch --detach FETCH_HEAD
            git switch -C codex/build-evidence
          else
            git switch --orphan codex/build-evidence
          fi
          test ! -e "$EVIDENCE_PATH"
          mkdir -p "$EVIDENCE_PATH"
          cp -R "$RUNNER_TEMP/retained-build/." "$EVIDENCE_PATH/"
          git add -- "$EVIDENCE_PATH"
          git commit -m "[skip ci] Record build evidence for run $GITHUB_RUN_ID"
          for attempt in 1 2 3; do
            if git push origin HEAD:refs/heads/codex/build-evidence; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            git fetch origin codex/build-evidence
            git rebase FETCH_HEAD
          done
  device-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 35]
    env:
      TEST_API_LEVEL: ${{ matrix.api-level }}
    steps:
      - uses: actions/checkout@v5
      - name: Initialize evidence even if emulator startup later fails
        run: scripts/run-device-tests.sh --initialize-only --output "$RUNNER_TEMP/instrumentation-evidence"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install pinned compilation SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Run current-source tests with granted and denied permissions
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none -accel on
          script: bash scripts/run-device-validation.sh
      - name: Retain actual XML, selected logs, and counts even on failure
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instrumentation-evidence-api-${{ matrix.api-level }}
          path: ${{ runner.temp }}/instrumentation-evidence/
          if-no-files-found: error
          retention-days: 90
  retain-device-evidence:
    # PR code never receives repository write access. Artifact retention above still applies.
    if: ${{ always() && github.event_name != 'pull_request' }}
    needs: device-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 35]
    concurrency:
      group: cutedog-instrumentation-evidence-api-${{ matrix.api-level }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: instrumentation-evidence-api-${{ matrix.api-level }}
          path: ${{ runner.temp }}/retained-instrumentation
      - name: Append evidence to its dedicated API branch
        env:
          EVIDENCE_BRANCH: codex/instrumentation-evidence-api${{ matrix.api-level }}
          EVIDENCE_PATH: runs/${{ github.run_id }}-${{ github.run_attempt }}/api-${{ matrix.api-level }}
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/retained-instrumentation/summary.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git ls-remote --exit-code --heads origin "refs/heads/$EVIDENCE_BRANCH" >/dev/null; then
            git fetch origin "$EVIDENCE_BRANCH"
            git switch --detach FETCH_HEAD
            git switch -C "$EVIDENCE_BRANCH"
          else
            git switch --orphan "$EVIDENCE_BRANCH"
          fi
          test ! -e "$EVIDENCE_PATH"
          mkdir -p "$EVIDENCE_PATH"
          cp -R "$RUNNER_TEMP/retained-instrumentation/." "$EVIDENCE_PATH/"
          git add -- "$EVIDENCE_PATH"
          git commit -m "[skip ci] Record API ${{ matrix.api-level }} instrumentation evidence for run $GITHUB_RUN_ID"
          for attempt in 1 2 3; do
            if git push origin "HEAD:refs/heads/$EVIDENCE_BRANCH"; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            git fetch origin "$EVIDENCE_BRANCH"
            git rebase FETCH_HEAD
          done
