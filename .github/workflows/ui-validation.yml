name: Published APK UI validation
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release containing the exact APK to test
        default: v0.1.0-preview.2
        required: true
      apk_sha256:
        description: Expected SHA-256 of the published APK
        default: ff0d78720bd4303830badaa70c60d3da669d5fe6c6056ca6750880bb1ec59cdb
        required: true
  push:
    branches: [main]
    paths:
      - '.github/workflows/ui-validation.yml'
      - 'scripts/device-smoke.py'
      - 'releases/**'
    paths: ['scripts/device-smoke.py', '.github/workflows/ui-validation.yml']
permissions:
  contents: write
concurrency:
  group: cutedog-published-apk-ui-evidence
  cancel-in-progress: false
jobs:
  real-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ inputs.release_tag || 'v0.1.0-preview.2' }}
      EXPECTED_APK_SHA: ${{ inputs.apk_sha256 || 'ff0d78720bd4303830badaa70c60d3da669d5fe6c6056ca6750880bb1ec59cdb' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - name: Download and verify the published APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/ui-evidence" "$RUNNER_TEMP/published-apk"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern CuteDog-0.1.0-debug.apk --dir "$RUNNER_TEMP/published-apk"
          printf '%s  %s\n' "$EXPECTED_APK_SHA" "$RUNNER_TEMP/published-apk/CuteDog-0.1.0-debug.apk" | sha256sum --check
      - name: Enable hardware virtualization
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Real application UI, persistence and overlay interactions
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none -accel on
          script: python3 scripts/device-smoke.py --apk "$RUNNER_TEMP/published-apk/CuteDog-0.1.0-debug.apk" --expected-sha256 "$EXPECTED_APK_SHA" --output "$RUNNER_TEMP/ui-evidence"
      - name: Upload actual device evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: published-apk-ui-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/ui-evidence/
          if-no-files-found: warn
      - name: Retain evidence on a dedicated branch
        if: always()
        env:
          EVIDENCE_PATH: runs/${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          test -f "$RUNNER_TEMP/ui-evidence/assertions.json" || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git ls-remote --exit-code --heads origin refs/heads/codex/device-evidence >/dev/null; then
            git fetch origin codex/device-evidence
            git switch --detach FETCH_HEAD
            git switch -C codex/device-evidence
          else
            git switch --orphan codex/device-evidence
          fi
          mkdir -p "$EVIDENCE_PATH"
          cp -R "$RUNNER_TEMP/ui-evidence/." "$EVIDENCE_PATH/"
          git add "$EVIDENCE_PATH"
          git commit -m "[skip ci] Record published APK device evidence for run $GITHUB_RUN_ID"
          git push origin HEAD:refs/heads/codex/device-evidence
