name: Published APK UI validation
on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: Exact HTTPS URL of the final APK to validate
        required: true
      apk_sha256:
        description: SHA-256 of that exact final APK
        required: true
      source_commit:
        description: Full source commit declared for that APK
        required: true
      baseline_url:
        description: Optional explicit older APK URL for an in-place upgrade check
        required: false
      baseline_sha256:
        description: SHA-256 required when baseline_url is supplied
        required: false
  push:
    branches: [main]
    paths:
      - 'scripts/ui-validation-request.json'
permissions:
  contents: write
concurrency:
  group: cutedog-published-apk-ui-evidence
  cancel-in-progress: false
jobs:
  real-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Download and verify explicitly requested APK bytes and metadata
        env:
          INPUT_APK_URL: ${{ inputs.apk_url }}
          INPUT_APK_SHA256: ${{ inputs.apk_sha256 }}
          INPUT_SOURCE_COMMIT: ${{ inputs.source_commit }}
          INPUT_BASELINE_URL: ${{ inputs.baseline_url }}
          INPUT_BASELINE_SHA256: ${{ inputs.baseline_sha256 }}
          REQUEST_EVENT: ${{ github.event_name }}
        run: |
          request=()
          if [[ "$REQUEST_EVENT" == push ]]; then
            request=(--request scripts/ui-validation-request.json)
          fi
          python3 scripts/prepare-ui-validation.py prepare "${request[@]}" --apk-dir "$RUNNER_TEMP/published-apk" --output "$RUNNER_TEMP/ui-evidence"
      - name: Enable and verify hardware virtualization with retained diagnostics
        run: |
          mkdir -p "$RUNNER_TEMP/ui-evidence/kvm"
          python3 scripts/setup-ci-kvm.py --output "$RUNNER_TEMP/ui-evidence/kvm" 2>&1 | tee "$RUNNER_TEMP/ui-evidence/kvm/setup.log"
      - name: Real application UI, persistence and overlay interactions
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none -accel on
          script: python3 scripts/prepare-ui-validation.py run-device --apk-dir "$RUNNER_TEMP/published-apk" --output "$RUNNER_TEMP/ui-evidence"
      - name: Upload actual device evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: published-apk-ui-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/ui-evidence/
          if-no-files-found: warn
      - name: Retain evidence on a dedicated branch
        if: always()
        env:
          EVIDENCE_PATH: runs/${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          test -f "$RUNNER_TEMP/ui-evidence/release-input.json" || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git ls-remote --exit-code --heads origin refs/heads/codex/device-evidence >/dev/null; then
            git fetch origin codex/device-evidence
            git switch --detach FETCH_HEAD
            git switch -C codex/device-evidence
          else
            git switch --orphan codex/device-evidence
          fi
          mkdir -p "$EVIDENCE_PATH"
          cp -R "$RUNNER_TEMP/ui-evidence/." "$EVIDENCE_PATH/"
          git add "$EVIDENCE_PATH"
          git commit -m "[skip ci] Record published APK device evidence for run $GITHUB_RUN_ID"
          git push origin HEAD:refs/heads/codex/device-evidence
